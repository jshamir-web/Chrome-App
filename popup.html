<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Yofi Risk Score</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header>
      <div class="logo">
        <span class="logo-icon">Y</span>
        <span class="logo-text">Yofi <span class="logo-sub">Risk</span></span>
      </div>
      <div class="header-actions">
        <button id="historyBtn" class="icon-btn" title="Chat history">&#9776;</button>
        <button id="newChatBtn" class="icon-btn" title="New chat">&#43;</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">&#9881;</button>
      </div>
    </header>

    <!-- Settings panel -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-title">Configuration</div>
      <label>
        Server URL
        <input id="apiKey" type="text" placeholder="https://your-server.railway.app" />
      </label>
      <div class="settings-actions">
        <button id="saveSettings" class="btn-primary">Save</button>
        <button id="cancelSettings" class="btn-ghost">Cancel</button>
      </div>
    </div>

    <!-- History sidebar -->
    <div id="historySidebar" class="history-sidebar hidden">
      <div class="history-header">
        <span>Chat History</span>
        <button id="closeHistory" class="icon-btn">&#10005;</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>

    <!-- Screenshot preview -->
    <div id="screenshotSection">
      <div id="screenshotPreview" class="screenshot-placeholder">
        <span class="placeholder-text">&#128247; No screenshot — click Capture</span>
      </div>
      <div class="screenshot-controls">
        <button id="captureBtn" class="btn-primary btn-sm">&#128247; Capture Page</button>
        <button id="clearScreenshot" class="btn-ghost btn-sm hidden">&#10005; Clear</button>
        <button id="hideOverlayBtn" class="btn-ghost btn-sm hidden">&#10006; Hide Overlay</button>
      </div>
    </div>

    <!-- Risk score banner -->
    <div id="scoreBanner" class="hidden">
      <div class="score-left">
        <div class="score-label">Risk Score</div>
        <div id="scoreValue" class="score-value">—</div>
      </div>
      <div class="score-right">
        <div id="scoreBar"><div id="scoreBarFill"></div></div>
        <div id="scoreCategory" class="score-category"></div>
      </div>
    </div>

    <!-- Chat messages -->
    <div id="chatMessages" class="chat-messages"></div>

    <!-- Input -->
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="Ask about risk… (Enter to send)" rows="1"></textarea>
      <button id="sendBtn" class="btn-send" title="Analyse">&#10148;</button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
